<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 16px; width: 868px; background: #fff; font-size: 28px; }
  p { margin: 6px 0; }
  canvas { display: block; margin-top: 8px; }
</style>
<script src="/vendor/gsap/dist/gsap.min.js"></script>
<script type="importmap">{"imports": {"three": "/vendor/three/build/three.module.js",
                                      "three/addons/": "/vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <p style="font-family: sans-serif">sans-serif：直骨门 简体字形 Chromium 😀🎬</p>
  <p style="font-family: serif">serif：思源宋体 直骨门</p>
  <p style="font-family: monospace">monospace: const 中文 = 42;</p>
  <p style="font-family: 'LXGW WenKai'">LXGW WenKai：霞鹜文楷</p>
  <p style="font-family: 'Smiley Sans'">Smiley Sans：得意黑</p>
  <p style="font-family: 'ZCOOL KuaiLe'">ZCOOL KuaiLe：站酷快乐体</p>
  <canvas id="c" width="420" height="200"></canvas>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  const canvas = document.getElementById('c');
  const result = { gsap: window.gsap ? gsap.version : null, three: THREE.REVISION, addons: !!OrbitControls };
  const gl = document.createElement('canvas').getContext('webgl2');
  result.webgl = gl ? gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info')?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER) : null;
  if (gl) {
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202840);
    const camera = new THREE.PerspectiveCamera(45, 420 / 200, 0.1, 100);
    camera.position.set(2.5, 1.8, 3);
    camera.lookAt(0, 0, 0);
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xff7a1a })));
    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(3, 4, 2);
    scene.add(light, new THREE.AmbientLight(0xffffff, 0.4));
    renderer.render(scene, camera);
  }
  document.title = JSON.stringify(result);
</script>
</body>
</html>
